<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#e8f0f8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 状态栏透明，页面一直画到最上面（Vesper 和 Clawd 一样）；iOS 只认 HTML 里写死的这一项，脚本改它没用 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      try {
        // Vesper 一打开就是 Home：壁纸和 JS 一起开始下，不等 React 跑起来
        // 字体也一样：不等 React，这里就开始下（VesperApp 看到 #vesper-fonts 就不再加）
        if (localStorage.getItem('mu_skin') === 'vesper') {
          // 全局一个底色：和开屏的底色一样（白天蓝、夜间黑；html、body、theme-color）。
          // iOS 27 的系统顶边效果拿 html 底色上色，不一样的话开屏顶上会多一条（skin-checklist 第 3c 条，颜色和 VesperApp 的 CHROME.splash 一致）
          var m = localStorage.getItem('mu_vesper_mode')
          var dark = m === 'night' || (m !== 'day' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
          var bg = dark ? '#000000' : '#66799e'
          var top = document.createElement('style'); top.id = 'vesper-top'
          top.textContent = 'html:root,html:root body{background:' + bg + '}'
          document.head.appendChild(top)
          document.querySelector('meta[name="theme-color"]').content = bg
          ['', '-b3', '-b8', '-b16', '-b30'].forEach(function (b) {
            var l = document.createElement('link'); l.rel = 'preload'; l.as = 'image'; l.href = '/vesper/home-bg' + b + '.webp'; document.head.appendChild(l)
          })
          ;['https://fonts.googleapis.com', 'https://fonts.gstatic.com'].forEach(function (h) {
            var l = document.createElement('link'); l.rel = 'preconnect'; l.href = h; l.crossOrigin = ''; document.head.appendChild(l)
          })
          var f = document.createElement('link'); f.id = 'vesper-fonts'; f.rel = 'stylesheet'
          f.href = 'https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+SC:wght@300;400;500&family=LXGW+WenKai+TC&display=swap'
          document.head.appendChild(f)
        }
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-title" content="沐" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>沐</title>
    <style>
      html, body { background: #e8f0f8; margin: 0; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
      }
    </script>
  </body>
</html>
